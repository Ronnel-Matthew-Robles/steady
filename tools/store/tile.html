<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; animation: none !important; transition: none !important; }
    html, body { width: 440px; height: 280px; overflow: hidden; }
    body {
      background: linear-gradient(180deg, #3b4a5a, #52606e);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    }
    .mark { display: block; }
    h1 { color: #eef2f5; font-size: 46px; font-weight: 700; letter-spacing: 0.5px; }
    p {
      color: #c7d2db;
      font-size: 17px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <svg class="mark" width="56" height="56" viewBox="0 0 34 34" aria-hidden="true">
    <rect x="1" y="1" width="32" height="32" rx="8" fill="#eef2f5"/>
    <rect x="8" y="15.5" width="18" height="3" rx="1.5" fill="#3b4a5a"/>
  </svg>
  <h1>Steady</h1>
  <p>Reduce motion. Calm the web.</p>
</body>
</html>
