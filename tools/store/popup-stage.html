<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; animation: none !important; transition: none !important; }
    body {
      min-height: 100vh;
      background: #f4f6f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    }
    h1 { font-size: 38px; color: #1f2933; font-weight: 700; }
    .frame {
      border: 1px solid #d3dae0;
      border-radius: 14px;
      box-shadow: 0 18px 40px rgba(31, 41, 51, 0.14);
      overflow: hidden;
      background: #f4f6f8;
    }
    iframe { display: block; border: 0; width: 320px; height: 332px; }
    p {
      font-size: 17px;
      color: #46545f;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <h1>Two switches. That is the whole interface.</h1>
  <div class="frame"><iframe id="pf" src="../../popup/popup.html" title="Steady popup"></iframe></div>
  <p>One master switch, one per-site exception, remembered forever. Alt+Shift+S from the keyboard.</p>
  <script src="popup-stage.js"></script>
</body>
</html>
