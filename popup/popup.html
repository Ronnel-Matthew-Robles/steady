<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steady</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel" role="main">
    <header class="masthead">
      <svg width="26" height="26" viewBox="0 0 34 34" role="img" aria-label="Steady icon">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3b4a5a"/>
            <stop offset="1" stop-color="#52606e"/>
          </linearGradient>
        </defs>
        <rect x="1" y="1" width="32" height="32" rx="8" fill="url(#bg)"/>
        <rect x="8" y="15.5" width="18" height="3" rx="1.5" fill="#eef2f5"/>
      </svg>
      <h1 class="wordmark">Steady</h1>
      <span class="tagline">Calm the web</span>
    </header>

    <p id="status" class="status" role="status" aria-live="polite">Checking this page&hellip;</p>

    <div class="row">
      <div class="row-text">
        <span class="row-label" id="global-label">Steady everywhere</span>
        <span class="row-help">The master switch</span>
      </div>
      <button id="global-toggle" type="button" role="switch" aria-checked="true"
              aria-labelledby="global-label" class="switch">
        <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
        <span class="switch-state" aria-hidden="true">On</span>
      </button>
    </div>

    <div class="row" id="site-row">
      <div class="row-text">
        <span class="row-label" id="site-label">Allow motion on this site</span>
        <span class="row-help" id="site-host">&nbsp;</span>
      </div>
      <button id="site-toggle" type="button" role="switch" aria-checked="false"
              aria-labelledby="site-label site-host" class="switch">
        <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
        <span class="switch-state" aria-hidden="true">Off</span>
      </button>
    </div>

    <p id="note" class="note" hidden></p>

    <footer class="foot">
      <span class="foot-hint">Alt+Shift+S toggles this site</span>
      <span class="foot-links">
        <a id="options-link" href="../options.html" target="_blank" rel="noopener">All settings</a>
        <span aria-hidden="true">&middot;</span>
        <a id="report-link" href="report.html" target="_blank" rel="noopener">Report a problem</a>
      </span>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
